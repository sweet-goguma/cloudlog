<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudlog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Cafe24+Decobox&family=Cafe24+Dongdong&family=Cafe24+Meongi+W&family=Cutive+Mono&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/favicon/logo.svg" type="image/svg+xml" />
</head>
<body>

  <!-- 배경 장식 구름 -->
  <div class="bg-clouds" aria-hidden="true">
    <div class="bg-cloud bg-cloud-left">
      <svg viewBox="0 0 1227.75 1002" fill="none" xmlns="http://www.w3.org/2000/svg">

            <feFlood flood-opacity="0" result="BackgroundImageFix"/>

        </defs>
      </svg>
    </div>
    <div class="bg-cloud bg-cloud-right">
      <svg viewBox="0 0 1227.75 1002" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform:rotate(180deg)">
        <g filter="url(#f_right)">
          <path d="M406.938 802C349.873 802 301.123 782.247 260.689 742.741C220.255 703.234 200.025 654.949 200 597.884C200 548.972 214.736 505.39 244.209 467.138C273.682 428.885 312.248 404.429 359.906 393.769C375.583 336.077 406.938 289.359 453.969 253.616C501 217.872 554.302 200 613.875 200C687.244 200 749.488 225.56 800.608 276.68C851.728 327.8 877.275 390.031 877.25 463.375C920.519 468.392 956.426 487.054 984.97 519.361C1013.52 551.668 1027.78 589.444 1027.75 632.688C1027.75 679.719 1011.3 719.702 978.386 752.636C945.477 785.57 905.494 802.025 858.438 802H406.938Z" fill="#B7DAE4" fill-opacity="0.5"/>
        </g>
        <defs>
          <filter id="f_right" x="-37.625" y="-150.5" width="1303" height="1303" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
            <feFlood flood-opacity="0" result="BackgroundImageFix"/>
            <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
            <feGaussianBlur stdDeviation="100" result="effect1_foregroundBlur"/>
          </filter>
        </defs>
      </svg>
    </div>
  </div>

  <div class="app-shell">

    <!-- 상단 네비게이션 -->
    <header class="topbar">
      <button class="brand-btn" type="button" data-action="show-all" aria-label="전체 작품 보기">
        <svg class="brand-logo" viewBox="0 0 70.2968 51.5625" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M44.5155 0C39.7275 0.00367552 35.0349 1.33927 30.9625 3.8574C26.8901 6.37554 23.5986 9.97692 21.4559 14.2588C18.907 13.887 16.3088 14.0445 13.8234 14.7213C11.338 15.3982 9.01869 16.5798 7.01019 18.1927C5.00168 19.8055 3.34705 21.8149 2.1495 24.0955C0.951939 26.3761 0.237148 28.879 0.0497079 31.4481C-0.137733 34.0172 0.206198 36.5974 1.06005 39.0277C1.9139 41.4579 3.25935 43.6862 5.01248 45.5735C6.76561 47.4608 8.88882 48.9666 11.2497 49.997C13.6105 51.0274 16.1583 51.5603 18.7343 51.5625H44.5155C51.3531 51.5625 57.9107 48.8463 62.7456 44.0113C67.5805 39.1764 70.2968 32.6189 70.2968 25.7812C70.2968 18.9436 67.5805 12.3861 62.7456 7.55115C57.9107 2.71623 51.3531 0 44.5155 0ZM44.5155 46.875H18.7343C15.0046 46.875 11.4278 45.3934 8.79056 42.7562C6.15333 40.119 4.67175 36.5421 4.67175 32.8125C4.67175 29.0829 6.15333 25.506 8.79056 22.8688C11.4278 20.2316 15.0046 18.75 18.7343 18.75C19.0565 18.75 19.3788 18.75 19.6981 18.7822C19.0572 21.0599 18.7328 23.4151 18.7343 25.7812C18.7343 26.4029 18.9812 26.999 19.4207 27.4385C19.8603 27.8781 20.4564 28.125 21.078 28.125C21.6996 28.125 22.2957 27.8781 22.7353 27.4385C23.1748 26.999 23.4218 26.4029 23.4218 25.7812C23.4218 21.6093 24.6589 17.531 26.9767 14.0622C29.2945 10.5933 32.5889 7.8897 36.4433 6.29317C40.2977 4.69663 44.5389 4.2789 48.6307 5.09281C52.7225 5.90672 56.481 7.9157 59.431 10.8657C62.3811 13.8157 64.39 17.5743 65.2039 21.6661C66.0179 25.7579 65.6001 29.9991 64.0036 33.8535C62.4071 37.7079 59.7034 41.0023 56.2346 43.3201C52.7657 45.6379 48.6875 46.875 44.5155 46.875Z" fill="#1A1D29"/>
        </svg>
      </button>

      <nav class="main-nav" role="tablist" aria-label="작품 구분">
        <button class="nav-tab active" type="button" data-type="all" aria-selected="true">ALL</button>
        <div class="nav-tab-group">
          <button class="nav-tab" type="button" data-type="drama" aria-selected="false">DRAMA</button>
          <div class="country-dropdown">
            <button class="sub-tab" type="button" data-country="korea">KOR</button>
            <button class="sub-tab" type="button" data-country="japan">JAP</button>
            <button class="sub-tab" type="button" data-country="china">CHI</button>
            <button class="sub-tab" type="button" data-country="western">ENG</button>
            <button class="sub-tab" type="button" data-country="other">etc</button>
          </div>
        </div>
        <div class="nav-tab-group">
          <button class="nav-tab" type="button" data-type="movie" aria-selected="false">MOVIE</button>
          <div class="country-dropdown">
            <button class="sub-tab" type="button" data-country="korea">KOR</button>
            <button class="sub-tab" type="button" data-country="japan">JAP</button>
            <button class="sub-tab" type="button" data-country="china">CHI</button>
            <button class="sub-tab" type="button" data-country="western">ENG</button>
            <button class="sub-tab" type="button" data-country="other">etc</button>
          </div>
        </div>
        <button class="add-btn" type="button" id="openCreateButton" aria-label="작품 추가">
          <svg viewBox="0 0 42 36.4928" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.66 27.4928H10.75C10.63 27.4928 10.5113 27.4895 10.394 27.4828C10.2633 27.4895 10.132 27.4928 10 27.4928C7.74566 27.4928 5.58365 26.5973 3.98959 25.0032C2.39553 23.4092 1.5 21.2472 1.5 18.9928C1.5 16.7385 2.39553 14.5765 3.98959 12.9824C5.58365 11.3884 7.74566 10.4928 10 10.4928C10.1974 10.4929 10.3892 10.4272 10.5453 10.3063C10.7013 10.1854 10.8128 10.016 10.862 9.82483C11.486 7.33897 12.9582 5.1489 15.0245 3.63254C17.0908 2.11618 19.6216 1.36865 22.1801 1.51895C24.7387 1.66924 27.1646 2.70793 29.0391 4.45578C30.9137 6.20364 32.1193 8.551 32.448 11.0928" stroke="#1A1D29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M31 36.4928C33.9174 36.4928 36.7153 35.3339 38.7782 33.271C40.8411 31.2081 42 28.4102 42 25.4928C42 22.5754 40.8411 19.7776 38.7782 17.7147C36.7153 15.6518 33.9174 14.4928 31 14.4928C28.0826 14.4928 25.2847 15.6518 23.2218 17.7147C21.1589 19.7776 20 22.5754 20 25.4928C20 28.4102 21.1589 31.2081 23.2218 33.271C25.2847 35.3339 28.0826 36.4928 31 36.4928ZM31 18.5068C31.2652 18.5068 31.5196 18.6122 31.7071 18.7997C31.8946 18.9873 32 19.2416 32 19.5068V24.4928H36.986C37.2512 24.4928 37.5056 24.5982 37.6931 24.7857C37.8806 24.9733 37.986 25.2276 37.986 25.4928C37.986 25.758 37.8806 26.0124 37.6931 26.1999C37.5056 26.3875 37.2512 26.4928 36.986 26.4928H32V31.4808C32 31.746 31.8946 32.0004 31.7071 32.1879C31.5196 32.3755 31.2652 32.4808 31 32.4808C30.7348 32.4808 30.4804 32.3755 30.2929 32.1879C30.1054 32.0004 30 31.746 30 31.4808V26.4928H25.014C24.7488 26.4928 24.4944 26.3875 24.3069 26.1999C24.1194 26.0124 24.014 25.758 24.014 25.4928C24.014 25.2276 24.1194 24.9733 24.3069 24.7857C24.4944 24.5982 24.7488 24.4928 25.014 24.4928H30V19.5068C30 19.2416 30.1054 18.9873 30.2929 18.7997C30.4804 18.6122 30.7348 18.5068 31 18.5068Z" fill="#1A1D29"/>
          </svg>
        </button>
      </nav>
    </header>

    <!-- 검색 & 필터 -->
    <div class="controls-row">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 23.2962 23.2962" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.2962 22.2962L17.1579 17.1579M17.1579 17.1579C18.0368 16.279 18.734 15.2356 19.2097 14.0872C19.6854 12.9389 19.9302 11.7081 19.9302 10.4651C19.9302 9.22212 19.6854 7.99132 19.2097 6.84296C18.734 5.6946 18.0368 4.65118 17.1579 3.77226C16.279 2.89335 15.2356 2.19615 14.0872 1.72049C12.9389 1.24482 11.7081 1 10.4651 1C9.22212 1 7.99132 1.24482 6.84296 1.72049C5.6946 2.19615 4.65118 2.89335 3.77226 3.77226C1.99721 5.54731 1 7.95479 1 10.4651C1 12.9754 1.99721 15.3829 3.77226 17.1579C5.54731 18.933 7.95479 19.9302 10.4651 19.9302C12.9754 19.9302 15.3829 18.933 17.1579 17.1579Z" stroke="#95C5D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input id="searchInput" type="search" placeholder="RESEARCH" autocomplete="off" />
      </div>
      <div class="filter-group">
        <!-- OTT 커스텀 드롭다운 -->
        <div class="custom-select" id="ottDropdown" role="combobox" aria-label="OTT 필터">
          <button class="custom-select-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span class="custom-select-value" id="ottValue">OTT</span>
            <svg class="select-chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M6 9L12 15L18 9" stroke="#686e74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <ul class="custom-select-list" role="listbox">
            <li class="custom-option active" data-value="all" role="option">ALL</li>
            <li class="custom-option" data-value="Netflix" role="option">Netflix</li>
            <li class="custom-option" data-value="TVING" role="option">TVING</li>
            <li class="custom-option" data-value="Disney+" role="option">Disney+</li>
            <li class="custom-option" data-value="WATCHA" role="option">WATCHA</li>
            <li class="custom-option" data-value="Coupang Play" role="option">Coupang Play</li>
            <li class="custom-option" data-value="WeTV" role="option">WeTV</li>
            <li class="custom-option" data-value="IQIYI" role="option">IQIYI</li>
            <li class="custom-option" data-value="YOUKU" role="option">YOUKU</li>
            <li class="custom-option" data-value="etc" role="option">etc</li>
          </ul>
        </div>

        <!-- 정렬 커스텀 드롭다운 -->
        <div class="custom-select" id="sortDropdown" role="combobox" aria-label="정렬 기준">
          <button class="custom-select-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span class="custom-select-value" id="sortValue">최근 등록순</span>
            <svg class="select-chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M6 9L12 15L18 9" stroke="#686e74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <ul class="custom-select-list" role="listbox">
            <li class="custom-option active" data-value="recent" role="option">최근 등록순</li>
            <li class="custom-option" data-value="rating" role="option">별점 높은 순</li>
            <li class="custom-option" data-value="title" role="option">제목 오름차순</li>
          </ul>
        </div>
      </div>
    </div>

    <!-- 콘텐츠 영역 -->
    <main class="content-area">
      <div id="emptyState" class="empty-state hidden">
        <svg class="empty-cloud" viewBox="0 0 42.5011 27.9945" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M38.057 26.4945C45.413 20.1865 37.629 11.7265 29.545 11.7265C23.851 -10.4375 -9.55105 7.8945 5.25095 24.6005" stroke="#bbc4cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="empty-text">Not yet filled</p>
      </div>
      <div id="archiveGrid" class="archive-grid" aria-live="polite"></div>
    </main>

  </div>

  <!-- ═══ 등록/수정 모달 (Figma "NEW CLOUD" 화면) ═══ -->
  <div id="drawerBackdrop" class="form-backdrop hidden"></div>

  <div id="entryDrawer" class="form-modal" aria-hidden="true" aria-labelledby="drawerTitle">
    <div class="form-card">
      <div class="form-card-inner">
      <div class="form-bg-clouds" aria-hidden="true">
        <svg class="form-cloud-left" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg"><g filter="url(#fl)"><path d="M80 380C50 380 27 371 10 352C-7 333 -15 309 -15 281C-15 257 -8 236 7 218C22 200 42 189 65 183C74 156 88 134 107 117C127 99 151 91 178 91C209 91 235 101 256 121C277 141 288 166 288 195C308 197 325 204 338 217C351 230 358 247 358 265C358 286 350 303 334 317C318 330 299 337 277 337L80 337Z" fill="#B7DAE4" fill-opacity="0.6"/></g><defs><filter id="fl" x="-80" y="-70" width="520" height="490" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="55"/></filter></defs></svg>
        <svg class="form-cloud-right" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform:rotate(180deg)"><g filter="url(#fr)"><path d="M80 380C50 380 27 371 10 352C-7 333 -15 309 -15 281C-15 257 -8 236 7 218C22 200 42 189 65 183C74 156 88 134 107 117C127 99 151 91 178 91C209 91 235 101 256 121C277 141 288 166 288 195C308 197 325 204 338 217C351 230 358 247 358 265C358 286 350 303 334 317C318 330 299 337 277 337L80 337Z" fill="#B7DAE4" fill-opacity="0.6"/></g><defs><filter id="fr" x="-80" y="-70" width="520" height="490" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="55"/></filter></defs></svg>
      </div>

      <header class="form-header">
        <h2 id="drawerTitle" class="form-title">NEW CLOUD</h2>
        <div class="form-header-right">
          <div class="form-header-actions">
            <button class="form-action-btn" type="button" id="resetFormButton">RESET</button>
            <button class="form-action-btn save" type="submit" form="entryForm">SAVE</button>
          </div>
          <button class="form-close-btn" type="button" id="closeFormButton" aria-label="닫기">X</button>
        </div>
      </header>

      <form id="entryForm" class="form-body">
        <input type="hidden" id="entryId" />
        <input type="hidden" id="posterData" />
        <input type="hidden" id="typeInput" value="drama" />
        <input type="hidden" id="countryInput" value="korea" />

        <!-- 왼쪽: 입력 필드 -->
        <div class="form-left">
          <div class="form-row">
            <span class="form-row-label">TITLE</span>
            <input id="titleInput" class="form-input" type="text" placeholder="작품 제목" required autocomplete="off" />
          </div>

          <div class="form-row">
            <span class="form-row-label">ACTOR</span>
            <input id="actorsInput" class="form-input" type="text" placeholder="배우명" autocomplete="off" />
          </div>

          <div class="form-row rating-form-row">
            <span class="form-row-label">RATING</span>
            <div class="rating-right">
              <div class="rating-display-wrap">
                <input type="number" class="rating-number-box" id="ratingDisplay" min="0" max="5" step="0.5" value="0" />
                <span class="rating-denom">/ 5</span>
              </div>

          <div class="form-row">
            <span class="form-row-label">FORMAT</span>
            <div class="type-toggle">
              <button type="button" class="toggle-pill active" data-type-val="drama">DRAMA</button>
              <button type="button" class="toggle-pill" data-type-val="movie">MOVIE</button>
            </div>
          </div>

          <div class="form-row country-form-row">
            <span class="form-row-label">COUNTRY</span>
            <div class="country-toggle">
              <button type="button" class="toggle-pill active" data-country-val="korea">🇰🇷 KOREA</button>
              <button type="button" class="toggle-pill" data-country-val="japan">🇯🇵 JAPAN</button>
              <button type="button" class="toggle-pill" data-country-val="china">🇨🇳 CHINA</button>
              <button type="button" class="toggle-pill" data-country-val="taiwan">🇹🇼 TAIWAN</button>
              <button type="button" class="toggle-pill" data-country-val="uk">🇬🇧 UK</button>
              <button type="button" class="toggle-pill" data-country-val="usa">🇺🇸 USA</button>
              <button type="button" class="toggle-pill" data-country-val="other">ETC</button>
            </div>
          </div>

          <div class="form-row">
            <span class="form-row-label">PLOT</span>
            <textarea id="summaryInput" class="form-input" placeholder="줄거리를 입력하세요" rows="5" autocomplete="off"></textarea>
          </div>

          <div class="form-row quote-form-row">
            <span class="form-row-label">QUOTE</span>
            <div class="quote-inputs">
              <textarea id="quote1Input" class="form-input" placeholder="1" rows="3" autocomplete="off"></textarea>
              <textarea id="quote2Input" class="form-input" placeholder="2" rows="3" autocomplete="off"></textarea>
            </div>
          </div>

          <div class="form-row">
            <span class="form-row-label">NOTE</span>
            <textarea id="memoInput" class="form-input" placeholder="비고" rows="3" autocomplete="off"></textarea>
          </div>
        </div>

        <!-- 오른쪽: 포스터 + HIGHLIGHT + OTT -->
        <div class="form-right">
          <label class="poster-uploader" for="posterInput">
            <img id="posterPreview" alt="포스터 미리보기" class="hidden" />
            <span id="posterPlaceholder">포스터 이미지 첨부</span>
          </label>
          <input id="posterInput" class="visually-hidden" type="file" accept="image/*" />

          <!-- OTT 섹션 (로고 그리드) -->
          <div class="ott-section">
            <p class="ott-section-label">OTT <small>(2개까지 선택 가능)</small></p>
            <div class="ott-options">
              <label class="ott-opt"><input type="checkbox" name="ott" value="Netflix" /><img src="assets/ott/netflix.png" alt="Netflix" class="ott-logo" />NETFLIX</label>
              <label class="ott-opt"><input type="checkbox" name="ott" value="TVING" /><img src="assets/ott/tving.png" alt="TVING" class="ott-logo" />TVING</label>
              <label class="ott-opt"><input type="checkbox" name="ott" value="Disney+" /><img src="assets/ott/disney.png" alt="Disney+" class="ott-logo" />Disney+</label>
              <label class="ott-opt"><input type="checkbox" name="ott" value="WATCHA" /><img src="assets/ott/watcha.png" alt="WATCHA" class="ott-logo" />WATCHA</label>
              <label class="ott-opt"><input type="checkbox" name="ott" value="Coupang Play" /><img src="assets/ott/coupang.png" alt="Coupang Play" class="ott-logo" />COUPANG PLAY</label>
              <label class="ott-opt"><input type="checkbox" name="ott" value="WeTV" /><img src="assets/ott/wetv.png" alt="WeTV" class="ott-logo" />WeTV</label>
              <label class="ott-opt"><input type="checkbox" name="ott" value="IQIYI" /><img src="assets/ott/iqiyi.png" alt="IQIYI" class="ott-logo" />IQIYI</label>
              <label class="ott-opt"><input type="checkbox" name="ott" value="YOUKU" /><img src="assets/ott/youku.svg" alt="YOUKU" class="ott-logo" /><span style="position:relative;top:1px">YOUKU</span></label>
              <label class="ott-opt ott-etc"><input type="checkbox" name="ott" value="etc" />ETC</label>
            </div>
          </div>
        </div>
      </form>
      </div><!-- /form-card-inner -->
    </div>
  </div>

  <!-- ═══ 상세 모달 (Figma "click_contents" 화면) ═══ -->
  <div id="detailModal" class="detail-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="detail-backdrop" data-action="close-detail"></div>

      <div class="detail-card-inner">

        <svg class="form-cloud-right" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform:rotate(180deg)"><g filter="url(#dr)"><path d="M80 380C50 380 27 371 10 352C-7 333 -15 309 -15 281C-15 257 -8 236 7 218C22 200 42 189 65 183C74 156 88 134 107 117C127 99 151 91 178 91C209 91 235 101 256 121C277 141 288 166 288 195C308 197 325 204 338 217C351 230 358 247 358 265C358 286 350 303 334 317C318 330 299 337 277 337L80 337Z" fill="#B7DAE4" fill-opacity="0.6"/></g><defs><filter id="dr" x="-80" y="-70" width="520" height="490" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="55"/></filter></defs></svg>
      </div>
      <header class="detail-header">
        <div class="detail-header-left">
          <button class="detail-edit-btn" type="button" id="editFromDetailBtn">EDIT</button>
          <button class="detail-delete-btn" type="button" id="deleteFromDetailBtn">DELETE</button>
        </div>
        <button class="detail-close-btn" type="button" id="closeDetailButton" aria-label="닫기">X</button>
      </header>
      <div id="detailContent" class="detail-body"></div>
      </div><!-- /detail-card-inner -->
    </div>
  </div>

  <!-- 커스텀 확인 모달 -->
  <div id="confirmModal" class="confirm-modal" role="dialog" aria-modal="true">
    <div class="confirm-backdrop" id="confirmBackdrop"></div>
    <div class="confirm-card">
      <p class="confirm-message" id="confirmMessage"></p>
      <div class="confirm-actions">
        <button type="button" class="confirm-cancel-btn" id="confirmCancelBtn">취소</button>
        <button type="button" class="confirm-ok-btn" id="confirmOkBtn">확인</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
